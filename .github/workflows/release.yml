name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  release:
    needs: tests
    if: needs.tests.result == 'success'
    permissions:
      contents: read
    uses: janosh/workflows/.github/workflows/pypi-publish.yml@main
    # PyPI trusted publishing doesn't support reusable workflows, so pass PYPI_TOKEN
    secrets: inherit
